[project]
name = "onvy"
version = "0.3.0"
description = "Onvy — голосовой ассистент, связь и перевод для линейного персонала"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "httpx",
    "python-multipart",
    "pyjwt",
    "argon2-cffi",
    "segno",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "respx",
    "aiosqlite",
    "fakeredis>=2.37.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Depends()/Header() в дефолтах аргументов — идиома FastAPI, не баг.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
