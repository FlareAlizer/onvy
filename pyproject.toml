[project]
name = "project"
version = "0.1.0"
description = "Проект: бот / MVP / исследования"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "aiosqlite",
    "httpx",
    "python-multipart",
    "segno",
]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio", "respx"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Depends()/Header() в дефолтах аргументов — идиома FastAPI, не баг.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
