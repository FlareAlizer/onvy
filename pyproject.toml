[project]
name = "onvy"
version = "0.3.0"
description = "Onvy — голосовой ассистент, связь и перевод для линейного персонала"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "redis",
    "httpx",
    "python-multipart",
    "pyjwt",
    "argon2-cffi",
    "segno",
    "pydantic[email]>=2.13.4",
    "openpyxl",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "respx",
    "aiosqlite",
    "fakeredis>=2.37.0",
    # Только для scripts/pdf_menu_to_xlsx.py — разобрать «учебное пособие»
    # заведения в таблицу. В образ не входит: сервер PDF не читает.
    "pdfplumber",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Хуки Claude Code — чужой инструментарий разработки, не код продукта.
# Приводить их к нашему стилю бессмысленно: они обновляются извне, и правки
# затрутся. Из проверки исключены, чтобы CI падал только на нашем коде.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Depends()/Header() в дефолтах аргументов — идиома FastAPI, не баг.
extend-ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Фикстуры pytest переиспользуются импортом из соседнего модуля — для линтера
# это выглядит как переопределение неиспользуемого имени, но именно так pytest
# их и находит. Копировать стенд вместо импорта было бы хуже.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Только тесты приложения. У GPU-ноды свой пакет app/ и свой pytest.ini:
# без этой строки голый `pytest` собирает обе директории в одном процессе,
# два разных пакета с именем app сталкиваются, и сбор падает целиком.
testpaths = ["tests"]
markers = [
    "needs_db: требует живой PostgreSQL — пропускается, если базы нет",
]
