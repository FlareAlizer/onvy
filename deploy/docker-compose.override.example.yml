# Dev-parity override — same services as prod (postgres/redis/api), but with
# hot reload and ports exposed straight to localhost (no Caddy/TLS needed for
# 127.0.0.1 — browsers allow mic access on localhost over plain HTTP).
#
# Usage:
#   cp deploy/docker-compose.override.example.yml deploy/docker-compose.override.yml
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml \
#     --env-file .env up
#
# Do NOT use this for the pilot server — it skips Caddy/TLS entirely and
# reloads on every source change, which is not what you want in production.

services:
  postgres:
    ports:
      - "5432:5432" # local psql/DBeaver access

  redis:
    ports:
      - "6379:6379"

  api:
    build:
      target: runtime
    ports:
      - "8000:8000" # http://localhost:8000 directly, bypassing Caddy
    environment:
      DEBUG: "true"
    volumes:
      - ../app:/app/app:ro
    # --reload needs the app/ bind mount above; DB schema still needs a real
    # migration (`docker compose ... run --rm migrate`) before first use.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Caddy isn't needed for local dev — comment it back in if you want to test
  # the exact prod TLS/WS proxy path against a local self-signed cert setup.
  caddy:
    profiles: ["disabled-in-dev"]
