# Внешняя проверка живости с сигналом в телеграм.
#
# Смысл именно во «внешней»: проверка, запущенная на самом сервере, умирает
# вместе с ним. Прошлая недоступность длилась сутки, и узнали о ней не от
# проверки. GitHub Actions — площадка вне сервера, которая у нас уже есть.
#
# Что нужно завести один раз в Settings → Secrets and variables → Actions:
#   секреты:    TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   переменная: HEALTH_URL (например https://onvy.space/health)
#
# Пока HEALTH_URL не задан, проверка НЕ ЗАПУСКАЕТСЯ (см. условие у задачи ниже) —
# именно чтобы расписание не слало письма о собственной ненастроенности.
#
# Честно про частоту: расписание Actions даёт не чаще раза в 5 минут и под
# нагрузкой опаздывает ещё на несколько. Для «узнать раньше, чем позвонят из
# зала» этого хватает; если нужна минута — тот же scripts/health-watch.sh
# ставится таймером на ЛЮБУЮ другую машину, см. docs/runbook-deploy.md.

name: Health

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Проверки не должны наслаиваться: медленный прогон не отменяем, новый не
# запускаем — иначе состояние в кэше перезапишется задом наперёд.
concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: /health
    runs-on: ubuntu-latest
    # Пока проверка не настроена — не запускаемся вовсе.
    #
    # Без этого условия расписание молотит каждые пять минут, падает на
    # незаданном HEALTH_URL и шлёт письмо о провале — круглосуточно. Через день
    # такие письма начинают удалять не читая, и настоящая авария приходит в тот
    # же ящик, где лежат три сотни ложных. Сигнализация, которой перестали
    # верить, хуже отсутствующей.
    #
    # Пропущенная задача видна в списке прогонов как пропущенная — это честно:
    # проверка выключена, и это заметно. Зелёный прогон при незаданных
    # настройках был бы враньём: он выглядел бы как «сервер жив», хотя никто
    # ничего не проверял.
    if: vars.HEALTH_URL != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HEALTH_URL уже задан, иначе мы бы сюда не дошли. Проверяем оставшееся:
      # без токена бота сигнал некуда отправлять, и проверка бессмысленна.
      - name: Проверить, что есть куда слать сигнал
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          не_хватает=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && не_хватает="$не_хватает TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && не_хватает="$не_хватает TELEGRAM_CHAT_ID"
          if [ -n "$не_хватает" ]; then
            echo "::error::HEALTH_URL задан, но слать сигнал некуда — не хватает секретов:$не_хватает"
            echo "Заведите их в Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      # Состояние между прогонами — чтобы сигнал уходил на переходе, а не
      # каждые 5 минут всю ночь. Ключ уникальный на прогон, восстановление по
      # префиксу: кэш нельзя перезаписать, но можно положить новый и читать
      # самый свежий.
      - name: Забрать прошлое состояние
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-

      - name: Проверить
        id: probe
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: .health-state/state
        run: bash scripts/health-watch.sh

      # Сохраняем и когда упало, и когда поднялось: иначе следующий прогон не
      # узнает о переходе и либо промолчит про аварию, либо повторит сигнал.
      - name: Запомнить состояние
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
